<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechShop</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>TechShop</h1>
        <p>Інтернет-магазин техніки</p>
        <button class="cart btn-cart">
            🛒 Кошик: <span class="cart-counter">0</span>
        </button>
    </header>

    <main>
        <div class="favorites-zone" id="favoritesZone">
            <p>Перетягніть сюди товари в Улюблене</p>
        </div>

        <div class="search-bar" style="margin: 20px 0; display: flex; gap: 12px; align-items: center;">
            <input type="text" id="searchInput" placeholder="Почніть вводити назву товару...">
            <span id="searchResultCount" style="color: #666; font-size: 14px;"></span>
        </div>

        <h2>Наші товари</h2>
        <div class="products-grid"></div>
    </main>

    <footer>
        <p>© 2026 TechShop</p>
    </footer>

    <div class="modal-overlay hidden" id="cartOverlay">
        <div class="modal-window">
            <div class="modal-header">
                <h2>Ваш Кошик</h2>
                <button class="close-btn" id="closeCartBtn">&times;</button>
            </div>

            <div class="cart-items" id="cartItemsContainer">
                <p>Кошик порожній.</p>
            </div>

            <div class="modal-footer" style="display: block;">
                <h3 style="margin-bottom: 15px;">Разом: $<span id="cartTotalSum">0</span></h3>
                
                <form id="checkoutOrderForm" novalidate style="text-align: left; border-top: 1px solid #eee; padding-top: 15px;">
                    <div class="form-row" style="margin-bottom: 12px;">
                        <label for="clientName" style="display: block; margin-bottom: 4px; font-weight: bold;">ПІБ покупця:</label>
                        <input type="text" id="clientName" name="clientName" placeholder="Коваленко Олександр Сергійович" required style="width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px;">
                        <span class="input-error" id="nameError" style="color: red; font-size: 13px; display: block; margin-top: 4px;"></span>
                    </div>

                    <div class="form-row" style="margin-bottom: 12px;">
                        <label for="clientPhone" style="display: block; margin-bottom: 4px; font-weight: bold;">Номер телефону (+380...):</label>
                        <input type="tel" id="clientPhone" name="clientPhone" placeholder="+38 (097) 123-45-67" required style="width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px;">
                        <span class="input-error" id="phoneError" style="color: red; font-size: 13px; display: block; margin-top: 4px;"></span>
                    </div>

                    <div class="form-row" style="margin-bottom: 12px;">
                        <label for="clientEmail" style="display: block; margin-bottom: 4px; font-weight: bold;">Електронна пошта:</label>
                        <input type="email" id="clientEmail" name="clientEmail" placeholder="olexandr@example.com" required style="width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px;">
                        <span class="input-error" id="emailError" style="color: red; font-size: 13px; display: block; margin-top: 4px;"></span>
                    </div>

                    <div class="form-row" style="margin-bottom: 16px;">
                        <label for="orderPromo" style="display: block; margin-bottom: 4px; font-weight: bold;">Промокод (якщо є):</label>
                        <input type="text" id="orderPromo" name="orderPromo" placeholder="Введіть SALE10 для знижки 10%" style="width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px;">
                    </div>

                    <button type="submit" id="btnPlaceOrder" style="width: 100%; padding: 10px 20px; background: #28a745; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 16px; font-weight: bold;">
                        Підтвердити замовлення
                    </button>
                </form>
            </div>
        </div>
    </div>

    <script src="assets/js/main.js"></script>
</body>
</html>
